schema: spec-driven

context: |
  Tech stack: Python backend (uvicorn + asgineer + SQLite via itemdb) with frontend in Python compiled to JavaScript via PScript.
  Package: timetagger (setup.py), runtime deps in requirements.txt.
  Key directories: timetagger/ (main package), timetagger/app/ (frontend PScript), tests/ (pytest).
  Frontend code in timetagger/app/*.py compiles to JS — browser APIs are valid there.
  Formatting: Black (invoke format); linting: flake8 (invoke lint); tests: pytest tests/.
  Commits: Conventional Commits with gitmoji.
  Don't commit secrets, don't use --force flags.

